exclude: |
  (?x)^(
    \.git/|
    dist/|
    \.build/|
    go\.sum$
  )

repos:
  # ----------------------------------------------------------------
  # Security (required — verified by the global git hook)
  # ----------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        args: ["--config=.gitleaks.toml"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-executables-have-shebangs
      - id: check-case-conflict

  # Required: .env file check (hook id contains "detect-dotenv")
  - repo: local
    hooks:
      - id: detect-dotenv
        name: Block .env files
        language: fail
        entry: ".env files must not be committed; use a .env.example with dummy values instead."
        files: '(^|/)\.env(\.[^.]+)?$'
        exclude: '(^|/)\.env\.(example|sample|template)$'

  # ----------------------------------------------------------------
  # Hardcoded local absolute paths
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: no-hardcoded-local-paths
        name: Block hardcoded local absolute paths
        language: pygrep
        entry: '(/Users/[A-Za-z0-9_.-]+/|/home/[A-Za-z0-9_.-]+/|C:\\Users\\)'
        types_or: [text]
        exclude: |
          (?x)(
            \.md$|
            \.gitleaks\.toml$|
            \.pre-commit-config\.yaml$
          )

  # ----------------------------------------------------------------
  # Go
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        language: system
        entry: >-
          bash -c '
          out=$(gofmt -l "$@");
          if [ -n "$out" ]; then
          echo "gofmt needs to be run on:";
          echo "$out";
          exit 1;
          fi
          ' --
        types: [go]
      - id: go-vet
        name: go vet
        language: system
        entry: bash -c 'go vet ./...'
        types: [go]
        pass_filenames: false
